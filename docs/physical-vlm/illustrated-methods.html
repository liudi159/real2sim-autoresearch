<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图解方法 · Physical VLM</title><meta name="description" content="物理属性自动标注、知识校验与主动接触辨识的图解方法"><link rel="stylesheet" href="illustrations.css?v=1"></head><body class="method-page"><header class="method-page-header"><a href="./">← Physical VLM 技术全文</a><nav aria-label="图解导航"><a href="#illustrated-annotation">属性标注</a><a href="#illustrated-identification">接触辨识</a></nav></header><main><div class="method-page-intro"><span class="method-kicker">SELF-EVOLVING PHYSICAL VLM</span><h1>图解方法 <span>Illustrated Methods</span></h1><p>从物体图像、结构假设与知识先验，到主动实验、参数辨识和训练数据。</p></div><figure class="illustrated-method" id="illustrated-annotation"><div class="method-title"><div><span class="method-kicker">FIGURE 03A · ILLUSTRATED METHOD</span><h3>物理属性标注、知识校验与训练数据构建<small>Physical Annotation, Knowledge Verification & Data Construction</small></h3></div><a class="method-expand" href="illustrated-methods.html#illustrated-annotation" target="_blank" rel="noopener noreferrer">展开图解 ↗</a></div><div class="method-grid method-grid-five"><div class="method-card tone-blue"><div class="method-card-head"><span class="method-number">01</span><h4>数据筛选<small>Dataset Filtering</small></h4></div><svg class="method-scene" viewBox="0 85 428 570" role="img" aria-label="椅子、杯子、封闭盒子与金属圆柱的对象候选" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-1"><rect x="0" y="85" width="428" height="570"/></clipPath></defs><g clip-path="url(#method-crop-1)"><image href="figures/illustrations/physical-property-scenes.webp" width="2139" height="735"/></g></svg><div class="method-card-body"><p class="method-field">INPUT <b>图像 / 区域 / 深度</b></p><p>筛选完整对象，检查分割、尺度及视角覆盖。</p><ul><li class="check">保留可辨认实例</li><li class="reject">隔离严重遮挡</li></ul><span class="evidence-tag">Observed · 观测证据</span></div></div><div class="method-card tone-green"><div class="method-card-head"><span class="method-number">02</span><h4>物理属性提议<small>Physical Profiling</small></h4></div><svg class="method-scene" viewBox="428 85 428 570" role="img" aria-label="木椅的可见外观，用于生成类别与材料候选" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-2"><rect x="428" y="85" width="428" height="570"/></clipPath></defs><g clip-path="url(#method-crop-2)"><image href="figures/illustrations/physical-property-scenes.webp" width="2139" height="735"/></g></svg><div class="method-card-body"><dl><dt>Category</dt><dd>Chair</dd><dt>Material</dt><dd>Wood candidate</dd><dt>Body type</dt><dd>Rigid hypothesis</dd><dt>Mass</dt><dd>Unknown</dd></dl><span class="evidence-tag">Prior · 模型先验</span></div></div><div class="method-card tone-violet"><div class="method-card-head"><span class="method-number">03</span><h4>结构条件化<small>Structural Conditioning</small></h4></div><svg class="method-scene" viewBox="835 85 390 570" role="img" aria-label="木椅部件的分解示意，表示待验证的结构假设" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-3"><rect x="835" y="85" width="390" height="570"/></clipPath></defs><g clip-path="url(#method-crop-3)"><image href="figures/illustrations/physical-property-scenes.webp" width="2139" height="735"/></g></svg><div class="method-card-body"><p class="method-field">PARTS <b>椅背 / 座面 / 支撑</b></p><p>保留实心、空腔与复合材料等候选；隐藏结构需补充证据。</p><div class="method-equation">m ≈ ρV<sub>material</sub></div><small>均质假设下使用材料体积，不能直接代入包围盒体积。</small></div></div><div class="method-card tone-violet"><div class="method-card-head"><span class="method-number">04</span><h4>原型与先验检索<small>Prototype Retrieval</small></h4></div><svg class="method-scene" viewBox="1210 85 454 570" role="img" aria-label="不同结构的木椅与材料球，表示知识库检索候选" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-4"><rect x="1210" y="85" width="454" height="570"/></clipPath></defs><g clip-path="url(#method-crop-4)"><image href="figures/illustrations/physical-property-scenes.webp" width="2139" height="735"/></g></svg><div class="method-card-body"><p class="method-query">Chair × Wood × Structure</p><p>按类别、材料、结构与适用条件检索；返回属性范围、来源和测量方法。</p><span class="evidence-tag">KB prior · 知识先验</span><small>相似原型的质量不能直接赋给当前实例。</small></div></div><div class="method-card tone-gold"><div class="method-card-head"><span class="method-number">05</span><h4>校验与独立测量<small>Verification & Measurement</small></h4></div><svg class="method-scene" viewBox="1664 85 475 570" role="img" aria-label="木椅放在平台秤上，表示独立质量测量" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-5"><rect x="1700" y="85" width="439" height="570"/></clipPath></defs><g clip-path="url(#method-crop-5)"><image href="figures/illustrations/physical-property-scenes.webp" width="2139" height="735"/></g></svg><div class="method-card-body"><ul><li class="check">单位与条件一致性</li><li class="check">正值与区间约束</li><li class="question">实例质量仍需称重</li></ul><p>知识冲突触发补测；有效测量附标定、状态与证据 ID。</p><span class="evidence-tag">Measured · 测量证据</span></div></div></div><div class="method-output"><div><span>ASSET RECORD</span><b>条件化资产记录 φ</b><p>属性 · 单位 · 不确定性<br>适用条件 · 来源 · 版本</p></div><div><span>SFT EXAMPLES</span><b>标注与证据修订样本</b><p>观测 → 标签<br>旧预测 + 新证据 → 修订</p></div><div><span>GRPO REFERENCES</span><b>可验证训练参考</b><p>独立测量 / 可重放证据<br>奖励评分与最终测试分离</p></div></div><figcaption><b>图解说明：</b>以木椅为例展示从对象图像到属性证据的构建过程。分解视图表示结构假设；称重表示后续独立测量。插图由 AI 生成，仅用于解释方法，不代表真实样本或已完成实验。<a href="figures/illustrations/physical-property-scenes.webp" target="_blank" rel="noopener noreferrer">查看原始插图</a></figcaption></figure><figure class="illustrated-method" id="illustrated-identification"><div class="method-title"><div><span class="method-kicker">FIGURE 06A · EMBODIED MEASUREMENT</span><h3>主动感知与接触实验的物理辨识机制<small>Active Perception & Contact-based System Identification</small></h3></div><a class="method-expand" href="illustrated-methods.html#illustrated-identification" target="_blank" rel="noopener noreferrer">展开图解 ↗</a></div><p class="method-intro">根据待辨识属性选择实验。下列四项是候选动作；软体压入属于独立样本分支。</p><div class="method-grid method-grid-four"><div class="method-card tone-blue"><div class="method-card-head"><span class="method-number">A</span><h4>主动视觉观测<small>Active Visual Perception</small></h4></div><svg class="method-scene" viewBox="0 35 560 650" role="img" aria-label="RGB-D 相机观察封闭盒子" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-6"><rect x="0" y="35" width="560" height="650"/></clipPath></defs><g clip-path="url(#method-crop-6)"><image href="figures/illustrations/active-measurement-scenes.webp" width="2172" height="724"/></g></svg><div class="method-card-body"><p class="method-field">OBSERVE <b>多视角 RGB-D</b></p><p>补充遮挡、尺度和支撑关系；对齐物体与接触坐标。</p><div class="method-equation">Geometry / Contact</div><small>封闭盒子的内部填充与质量通常仍不可由外观唯一辨识。</small></div></div><div class="method-card tone-green"><div class="method-card-head"><span class="method-number">B</span><h4>Franka 准静态提起<small>Quasi-static Lifting</small></h4></div><img class="method-scene franka-scene" src="figures/illustrations/franka-hand-lifting.webp" alt="Franka 官方双指夹爪网格夹持盒子的渲染局部" width="850" height="1100" loading="lazy"><div class="method-card-body"><p class="method-field">MEASURE <b>净载荷 + 接触稳定性</b></p><p>对标定后的外力估计或测力装置去除工具重力与偏置，读取稳定阶段净载荷。</p><div class="method-equation">m ≈ F<sub>z,net</sub> / g</div><small>无额外支撑；固定装载状态。触觉辅助检测接触与滑移。</small></div></div><div class="method-card tone-gold"><div class="method-card-head"><span class="method-number">C</span><h4>受控滑动<small>Controlled Sliding</small></h4></div><svg class="method-scene" viewBox="1045 25 595 670" role="img" aria-label="水平测力探头推动木板上的自由盒子" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-7"><rect x="1045" y="25" width="595" height="670"/></clipPath></defs><g clip-path="url(#method-crop-7)"><image href="figures/illustrations/active-measurement-scenes.webp" width="2172" height="724"/></g></svg><div class="method-card-body"><p class="method-field">MEASURE <b>切向力 + 滑移起点</b></p><p>指定接触双方，在已知法向载荷下检测滑移起始时刻。</p><div class="method-equation">μ<sub>s</sub> ≈ F<sub>t,onset</sub> / F<sub>n</sub></div><small>适用库仑摩擦近似；排除倾覆和额外约束。稳定滑动另估 μ<sub>k</sub>。</small></div></div><div class="method-card tone-violet"><div class="method-card-head"><span class="method-number">D</span><h4>分级压入<small>Controlled Indentation</small></h4></div><svg class="method-scene" viewBox="1650 25 520 670" role="img" aria-label="压头对独立软体试样进行力位移测量" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="method-crop-8"><rect x="1650" y="25" width="520" height="670"/></clipPath></defs><g clip-path="url(#method-crop-8)"><image href="figures/illustrations/active-measurement-scenes.webp" width="2172" height="724"/></g></svg><div class="method-card-body"><p class="method-field">MEASURE <b>力—位移 / 加载—卸载</b></p><p>对独立软体试样分级压入，扣除夹具和传感器接触层形变。</p><div class="method-equation">k<sub>eff</sub> ≈ ΔF / Δδ</div><small>表示局部有效刚度；材料杨氏模量还依赖几何、接触模型与边界条件。</small></div></div></div><div class="franka-model-note"><a href="figures/illustrations/franka-panda-lifting.webp" target="_blank" rel="noopener noreferrer"><img src="figures/illustrations/franka-panda-lifting.webp" alt="使用 Franka 官方 FER/Panda 视觉网格和关节变换渲染的完整机械臂" width="1200" height="1200" loading="lazy"></a><div><span class="method-kicker">OFFICIAL ROBOT GEOMETRY</span><h4>Franka Panda（FER）与 Franka Hand</h4><p>采用官方视觉网格与关节坐标变换，按双指开合几何放置示意物体。上图提起动作使用夹爪局部渲染；左侧为机械臂全景。</p><p>净载荷需来自经过标定的外力估计或外置测力装置；模型渲染本身不提供质量测量。此图为几何配置示意，尚未进行动力学或抓取稳定性验证。</p><a href="https://github.com/frankarobotics/franka_description" target="_blank" rel="noopener noreferrer">官方模型 / franka_description ↗</a> · <a href="figures/illustrations/source/README.md">模型版本与渲染说明</a></div></div><div class="method-evidence"><b>同步证据 / Synchronized Evidence</b><span>RGB-D · Tactile · Force/Torque · Pose · Action · Timestamp</span></div><div class="method-loop"><div><b>参数辨识</b><span>System Identification</span><small>拟合响应，检查残差与多解性</small></div><i aria-hidden="true">→</i><div><b>独立交互验证</b><span>Held-out Interaction</span><small>用未参与拟合的动作检验预测</small></div><i aria-hidden="true">→</i><div><b>资产与训练样本更新</b><span>Asset & Dataset Revision</span><small>保存后验、证据引用和修订记录</small></div></div><figcaption><b>图解说明：</b>观测与动作共同约束参数。当前交互先更新资产参数 φ；积累证据后再通过 SFT / GRPO 更新模型权重 θ。Franka 机械臂与夹爪由官方 3D 网格渲染，其余装置为 AI 生成示意；传感器配置需按真实平台标定。<a href="figures/illustrations/active-measurement-franka.svg" target="_blank" rel="noopener noreferrer">查看原始插图</a></figcaption></figure><p class="method-page-end">研究方案的概念插图 · 非实验结果 · <a href="./">返回完整技术路线</a></p></main></body></html>

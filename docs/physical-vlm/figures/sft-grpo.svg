3-3m0 6v-6h-6"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/></symbol><symbol id="i-grip" viewBox="0 0 24 24"><path d="M7 2h10v6H7zM8 8v4H4v6l3 3m9-13v4h4v6l-3 3M9 16v4m6-4v4"/></symbol><symbol id="i-pipette" viewBox="0 0 24 24"><path d="M9 10C2-1 22-1 15 10l-1 2v7l-2 3-2-3v-7l-1-2Zm0 2h6m-5 4h4"/></symbol><symbol id="i-beaker" viewBox="0 0 24 24"><path d="M4 3h15l-2 3v14H5V6L4 3Zm1 10h12M5 8h3m-3 9h3"/></symbol><symbol id="i-tube" viewBox="0 0 24 24"><path d="M7 2h10M8 2v16a4 4 0 0 0 8 0V2M8 12h8m-8-5h3m-3 2h2"/></symbol><symbol id="i-rod" viewBox="0 0 24 24"><path d="m6 21 15-15a2.1 2.1 0 0 0-3-3L3 18a2.1 2.1 0 0 0 3 3ZM7 14l3 3"/></symbol><symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h3l3-8 5 16 3-8h6"/></symbol><symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5ZM2 12l10 5 10-5M2 17l10 5 10-5"/></symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#668276" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#213d34}.en{fill:#637970}.minor{fill:#6a8077}</style><rect width="1080" height="885" rx="12" fill="white"/><text x="32" y="35" font-size="13" text-anchor="start" font-weight="600" style="fill:#607b6c">FIG. 05</text><text x="32" y="67" font-size="25" text-anchor="start" font-weight="600">监督微调与可验证强化学习</text><text x="32" y="94" font-size="15" text-anchor="start" font-weight="400" style="fill:#657c70">Supervised Fine-tuning → Group Relative Policy Optimization</text><rect x="32" y="145" width="285" height="112" rx="8" fill="#eef4fa" stroke="#416b99"/><use href="#i-database" x="48" y="160" width="25" height="25" fill="none" stroke="#416b99" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="179" font-size="19" text-anchor="start" font-weight="600" style="fill:#416b99">版本化训练快照</text><text x="48" y="209" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Versioned Training Snapshot</text><text x="48" y="236" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">弱标签 + 实测标签 + 纠错对</text><rect x="397" y="145" width="285" height="112" rx="8" fill="#f3f0fa" stroke="#6557a0"/><use href="#i-layers" x="413" y="160" width="25" height="25" fill="none" stroke="#6557a0" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="449" y="179" font-size="19" text-anchor="start" font-weight="600" style="fill:#6557a0">监督微调 SFT</text><text x="413" y="209" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Supervised Fine-tuning</text><text x="413" y="236" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">多模态对齐 / 标注 / 纠错</text><rect x="762" y="145" width="286" height="112" rx="8" fill="#f3f0fa" stroke="#6557a0"/><use href="#i-file" x="778" y="160" width="25" height="25" fill="none" stroke="#6557a0" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="179" font-size="19" text-anchor="start" font-weight="600" style="fill:#6557a0">初始策略 πSFT</text><text x="778" y="209" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Initial Annotation Policy</text><text x="778" y="236" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">固定输入 x / 采样配置</text><path d="M321 200 L391 200" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M686 200 L756 200" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M905 261 L905 307 L540 307 L540 347" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="318" y="350" width="444" height="112" rx="8" fill="#f3f0fa" stroke="#6557a0"/><use href="#i-layers" x="334" y="365" width="25" height="25" fill="none" stroke="#6557a0" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="384" font-size="19" text-anchor="start" font-weight="600" style="fill:#6557a0">组内候选回答</text><text x="334" y="414" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Grouped Responses: y₁ … yG</text><text x="334" y="441" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">相同观测 / 参数 / 区间 / 证据引用</text><rect x="32" y="531" width="318" height="112" rx="8" fill="#edf7f2" stroke="#1c7162"/><use href="#i-grip" x="48" y="546" width="25" height="25" fill="none" stroke="#1c7162" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="565" font-size="19" text-anchor="start" font-weight="600" style="fill:#1c7162">独立奖励来源</text><text x="48" y="595" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Measured Training References</text><text x="48" y="622" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">标定测量 / 可重放物理证据</text><rect x="405" y="531" width="309" height="112" rx="8" fill="#fbf6ea" stroke="#9a712d"/><use href="#i-check" x="421" y="546" width="25" height="25" fill="none" stroke="#9a712d" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="457" y="565" font-size="19" text-anchor="start" font-weight="600" style="fill:#9a712d">可验证评分器</text><text x="421" y="595" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Verifiable Reward R</text><text x="421" y="622" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">属性 / 预测 / 校准 / 证据</text><rect x="762" y="531" width="286" height="112" rx="8" fill="#f3f0fa" stroke="#6557a0"/><use href="#i-sliders" x="778" y="546" width="25" height="25" fill="none" stroke="#6557a0" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="565" font-size="19" text-anchor="start" font-weight="600" style="fill:#6557a0">GRPO 参数更新</text><text x="778" y="595" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Policy Update θ → θ′</text><text x="778" y="622" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">组内优势 / 策略约束</text><path d="M540 467 L540 526" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M354 585 L399 585" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M718 585 L756 585" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M905 648 L905 706 L182 706 L182 408 L313 408" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="223" y="731" font-size="15" text-anchor="start" font-weight="400" style="fill:#6557a0">迭代采样 / Iterative Sampling</text><rect x="32" y="772" width="1016" height="76" rx="8" fill="#f4f7f5" stroke="#cfdfd5"/><use href="#i-lock" x="49" y="794" width="25" height="25" fill="none" stroke="#456d55" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="804" font-size="20" text-anchor="start" font-weight="600" style="fill:#375c47">开发集用于版本比较；最终保留集不参与训练奖励。</text><text x="95" y="831" font-size="16" text-anchor="start" font-weight="400" style="fill:#6b7e72">Development Evaluation ≠ Training Reward ≠ Final Held-out Test</text></svg>
76" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="36" y="543" width="358" height="106" rx="8" fill="#fbf6ea" stroke="#9a712d"/><use href="#i-check" x="52" y="558" width="25" height="25" fill="none" stroke="#9a712d" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="577" font-size="19" text-anchor="start" font-weight="600" style="fill:#9a712d">独立开发集评估</text><text x="52" y="607" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Independent Evaluation</text><text x="52" y="634" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">固定评分协议；最终测试不反馈</text><path d="M215 650 L215 672 L117 672 L117 695" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M215 672 L312 672 L312 695" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="25" y="697" width="184" height="109" rx="8" fill="#edf7f2" stroke="#1c7162"/><use href="#i-check" x="41" y="712" width="25" height="25" fill="none" stroke="#1c7162" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="77" y="731" font-size="19" text-anchor="start" font-weight="600" style="fill:#1c7162">保留</text><text x="41" y="761" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Keep Revision</text><text x="41" y="788" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">经验证的收益</text><rect x="223" y="697" width="184" height="109" rx="8" fill="#f6f8f6" stroke="#52645c"/><use href="#i-branch" x="239" y="712" width="25" height="25" fill="none" stroke="#52645c" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="275" y="731" font-size="19" text-anchor="start" font-weight="600" style="fill:#52645c">回滚</text><text x="239" y="761" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Rollback</text><text x="239" y="788" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">归档失败证据</text><rect x="25" y="838" width="380" height="58" rx="8" fill="#f1f6f3" stroke="#c5d9cc"/><use href="#i-loop" x="40" y="853" width="24" height="24" fill="none" stroke="#1c7162" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="861" font-size="13" text-anchor="start" font-weight="400" style="fill:#315c48">保留失败分支以支持后续研究</text><text x="78" y="881" font-size="13" text-anchor="start" font-weight="400" style="fill:#315c48">新一轮从当前证据与保留版本开始</text></svg>
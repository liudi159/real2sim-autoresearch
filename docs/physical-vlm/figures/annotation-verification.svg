="474" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Active Measurement</text><text x="48" y="501" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">先验冲突 / 实际观测</text><path d="M752 271 L752 335 L145 335 L145 405" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="480" y="324" font-size="14" text-anchor="start" font-weight="400" style="fill:#1c7162">冲突 / Conflict</text><rect x="32" y="566" width="1016" height="51" rx="8" fill="#edf7f2" stroke="#a8cdbb"/><use href="#i-database" x="47" y="578" width="25" height="25" fill="none" stroke="#1c7162" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="87" y="598" font-size="18" text-anchor="start" font-weight="400" style="fill:#255b44">实测验证 → 高质量标签池 / Measured &amp; Validated Labels</text><path d="M147 526 L147 561" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/></svg>
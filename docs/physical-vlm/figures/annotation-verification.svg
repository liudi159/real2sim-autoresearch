<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="655" viewBox="0 0 1080 655" role="img" aria-labelledby="title desc"><title id="title">自动标注与物理知识校验</title><desc id="desc">硬约束失败的标签隔离；知识先验一致的候选进入弱标签池；先验冲突进入补测和辨识，实测验证后进入高质量池。</desc><defs><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Zm0 10L3 7m9 5 9-5m-9 5v10M7.5 4.5l9 5"/></symbol><symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10m0-4h6a6 6 0 0 0 6-5"/></symbol><symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6m-5 0v7L4 20c-.4.7 0 1 1 1h14c1 0 1.4-.3 1-1l-6-10V3M7 15h10"/></symbol><symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 3v4m0 4v10M12 3v10m0 4v4M20 3v1m0 4v13M1 7h6v4H1V7Zm8 6h6v4H9v-4Zm8-9h6v4h-6V4Z"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m8 12 3 3 5-6M12 2l9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><path d="m7 6-6 6 6 6m10-12 6 6-6 6M14 3l-4 18"/></symbol><symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol><symbol id="i-ruler" viewBox="0 0 24 24"><path d="m3 16 13-13 5 5L8 21l-5-5Zm6-6 3 3m1-7 3 3M5 14l3 3"/></symbol><symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7l-5-5Zm0 0v5h5M8 12h8m-8 4h6"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M3 12h17m-6-6 6 6-6 6"/></symbol><symbol id="i-loop" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-6v6h6M4 16a8 8 0 0 0 14 3l3-3m0 6v-6h-6"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/></symbol><symbol id="i-grip" viewBox="0 0 24 24"><path d="M7 2h10v6H7zM8 8v4H4v6l3 3m9-13v4h4v6l-3 3M9 16v4m6-4v4"/></symbol><symbol id="i-pipette" viewBox="0 0 24 24"><path d="M9 10C2-1 22-1 15 10l-1 2v7l-2 3-2-3v-7l-1-2Zm0 2h6m-5 4h4"/></symbol><symbol id="i-beaker" viewBox="0 0 24 24"><path d="M4 3h15l-2 3v14H5V6L4 3Zm1 10h12M5 8h3m-3 9h3"/></symbol><symbol id="i-tube" viewBox="0 0 24 24"><path d="M7 2h10M8 2v16a4 4 0 0 0 8 0V2M8 12h8m-8-5h3m-3 2h2"/></symbol><symbol id="i-rod" viewBox="0 0 24 24"><path d="m6 21 15-15a2.1 2.1 0 0 0-3-3L3 18a2.1 2.1 0 0 0 3 3ZM7 14l3 3"/></symbol><symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12h3l3-8 5 16 3-8h6"/></symbol><symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5ZM2 12l10 5 10-5M2 17l10 5 10-5"/></symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#668276" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#213d34}.en{fill:#637970}.minor{fill:#6a8077}</style><rect width="1080" height="655" rx="12" fill="white"/><text x="32" y="35" font-size="13" text-anchor="start" font-weight="600" style="fill:#607b6c">FIG. 03</text><text x="32" y="67" font-size="25" text-anchor="start" font-weight="600">自动标注与物理知识校验</text><text x="32" y="94" font-size="15" text-anchor="start" font-weight="400" style="fill:#657c70">Automatic Annotation and Physics Knowledge Verification</text><rect x="32" y="155" width="235" height="112" rx="8" fill="#eef4fa" strok
6 264 L906 329" fill="none" stroke="#668276" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="764" y="333" width="284" height="112" rx="8" fill="#edf7f2" stroke="#1c7162"/><use href="#i-wave" x="780" y="348" width="25" height="25" fill="none" stroke="#1c7162" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="816" y="367" font-size="19" text-anchor="start" font-weight="600" style="fill:#1c7162">同步交互证据</text><text x="780" y="397" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Synchronized Measurements</text><text x="780" y="424" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">RGB-D / Touch / Wrench / Action</text><rect x="398" y="333" width="284" height="112" rx="8" fill="#edf7f2" stroke="#1c7162"/><use href="#i-sliders" x="414" y="348" width="25" height="25" fill="none" stroke="#1c7162" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="367" font-size="19" text-anchor="start" font-weight="600" style="fill:#1c7162">物理参数辨识</text><text x="414" y="397" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Constrained Identification</text><text x="414" y="424" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">匹配轨迹、力和形变响应</text><rect x="32" y="333" width="284" height="112" rx="8" fill="#eef4fa" stroke="#416b99"/><use href="#i-layers" x="48" y="348" width="25" height="25" fill="none" stroke="#416b99" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="367" font-size="19" text-anchor="start" font-weight="600" style="fill:#416b99">更新参数后验</text><text x="48" y="397" font-size="15" text-anchor="start" font-weight="400" style="fill:#435e52">Posterior Update p(φ | D′)</text><text x="48" y="424" font-size="14" text-anchor="start" font-weight="400" style="fill:#6a8077">多解性 / 残差 / 有效范围</text><path d="M758 389 L688 389" fill="none" stroke="#668276" stroke-width="2" stroke
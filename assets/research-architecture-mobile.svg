<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1120" role="img" aria-labelledby="title desc"><title id="title">研究框架手机版</title><desc id="desc">建立观测、场景并冻结协议。研究循环诊断、设计、执行、开发比较；内部更新参数，证据不足请求真实补测。冻结候选后独立检验与交付。</desc><defs><marker id="arrow-172b39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#172b39" stroke-width="1.5"/></marker><marker id="arrow-63717a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#63717a" stroke-width="1.5"/></marker><marker id="arrow-227c79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#227c79" stroke-width="1.5"/></marker><marker id="arrow-c25b37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#c25b37" stroke-width="1.5"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="440" height="1120" rx="0" fill="#fbfaf6" stroke="none"/><text x="22" y="30" font-size="14" fill="#63717a" font-weight="600" text-anchor="start">01 / 建立共同研究起点</text><rect x="32" y="48" width="376" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="50" y="72" font-size="11" fill="#172b39" font-weight="600" text-anchor="start">INPUT</text><text x="50" y="100" font-size="19" fill="#172b39" font-weight="600" text-anchor="start">真实 / 合成观测</text><text x="50" y="126" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">视频、动作、尺度与测量</text><rect x="32" y="163" width="376" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="50" y="187" font-size="11" fill="#172b39" font-weight="600" text-anchor="start">SCENE</text><text x="50" y="215" font-size="19" fill="#172b39" font-weight="600" text-anchor="start">可执行场景</text><text x="50" y="241" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">几何、碰撞与物理表示</text><path d="M220 146V159" fill="none" stroke="#63717a" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-63717a)"/><path d="M220 261V290" fill="none" stroke="#63717a" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-63717a)"/><text x="220" y="314" font-size="13" fill="#63717a" font-weight="400" text-anchor="middle">冻结协议：拟合 / 开发 / 封存测试隔离</text><rect x="12" y="342" width="416" height="505" rx="8" fill="#eef4f3" stroke="#b9d2cd"/><text x="32" y="371" font-size="15" fill="#227c79" font-weight="600" text-anchor="start">02 / 研究外循环</text><rect x="32" y="392" width="170" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="50" y="416" font-size="11" fill="#227c79" font-weight="600" text-anchor="start">01 · DIAGNOSE</text><text x="50" y="444" font-size="19" fill="#227c79" font-weight="600" text-anchor="start">诊断偏差</text><text x="50" y="470" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">残差 → 竞争假设</text><rect x="238" y="392" width="170" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="256" y="416" font-size="11" fill="#227c79" font-weight="600" text-anchor="start">02 · DESIGN</text><text x="256" y="444" font-size="19" fill="#227c79" font-weight="600" text-anchor="start">设计实验</text><text x="256" y="470" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">选参数 / 机制 / 补测</text><rect x="238" y="535" width="170" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="256" y="559" font-size="11" fill="#227c79" font-weight="600" text-anchor="start">03 · IDENTIFY</text><text x="256" y="587" font-size="19" fill="#227c79" font-weight="600" text-anchor="start">执行与辨识</text><text x="256" y="613" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">有界搜索与敏感性</text><rect x="32" y="535" width="170" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="50" y="559" font-size="11" fill="#227c79" font-weight="600" text-anchor="start">04 · EVALUATE</text><text x="50" y="587" font-size="19" fill="#227c79" font-weight="600" text-anchor="start">开发集比较</text><text x="50" y="613" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">接受 / 拒绝 / 不确定</text><path d="M202 440H234" fill="none" stroke="#227c79" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-227c79)"/><path d="M323 490V531" fill="none" stroke="#227c79" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-227c79)"/><path d="M238 584H206" fill="none" stroke="#227c79" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-227c79)"/><path d="M117 535V513H22V440H28" fill="none" stroke="#227c79" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-227c79)"/><text x="47" y="510" font-size="11" fill="#227c79" font-weight="400" text-anchor="start">证据反馈</text><path d="M323 633V653" fill="none" stroke="#227c79" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-227c79)"/><rect x="238" y="658" width="170" height="75" rx="8" fill="white" stroke="#b9d2cd"/><text x="250" y="681" font-size="12" fill="#227c79" font-weight="600" text-anchor="start">参数内循环</text><text x="250" y="706" font-size="11" fill="#172b39" font-weight="400" text-anchor="start">θ → 仿真 → 残差 → θ</text><path d="M408 697H419V610H411" fill="none" stroke="#227c79" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-227c79)"/><text x="32" y="677" font-size="13" fill="#227c79" font-weight="600" text-anchor="start">研究记忆</text><text x="32" y="702" font-size="11" fill="#63717a" font-weight="400" text-anchor="start">版本 · 决策 · 失败原因</text><text x="32" y="723" font-size="11" fill="#63717a" font-weight="400" text-anchor="start">支持下一轮诊断</text><rect x="32" y="760" width="376" height="62" rx="8" fill="#fff6ee" stroke="#e7c3ac"/><text x="48" y="785" font-size="12" fill="#c25b37" font-weight="600" text-anchor="start">证据循环：请求补测 → 采集 → 新数据版本</text><text x="48" y="805" font-size="11" fill="#63717a" font-weight="400" text-anchor="start">采集完成后，基线与候选使用新数据共同重评。</text><path d="M408 440H435V791H412" fill="none" stroke="#c25b37" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-c25b37)"/><path d="M32 791H5V97H28" fill="none" stroke="#c25b37" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-c25b37)"/><path d="M220 847V899H80V943" fill="none" stroke="#172b39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-172b39)"/><text x="235" y="879" font-size="12" fill="#63717a" font-weight="400" text-anchor="start">满足停止条件</text><text x="22" y="925" font-size="14" fill="#63717a" font-weight="600" text-anchor="start">03 / 冻结后独立检验</text><rect x="22" y="947" width="116" height="79" rx="8" fill="white" stroke="#d8dedf"/><text x="80" y="977" font-size="16" fill="#172b39" font-weight="600" text-anchor="middle">冻结候选</text><text x="80" y="1003" font-size="11" fill="#63717a" font-weight="400" text-anchor="middle">模型与版本</text><rect x="162" y="947" width="116" height="79" rx="8" fill="white" stroke="#d8dedf"/><text x="220" y="977" font-size="16" fill="#172b39" font-weight="600" text-anchor="middle">独立测试</text><text x="220" y="1003" font-size="11" fill="#63717a" font-weight="400" text-anchor="middle">新动作 / 条件</text><rect x="302" y="947" width="116" height="79" rx="8" fill="white" stroke="#d8dedf"/><text x="360" y="977" font-size="16" fill="#172b39" font-weight="600" text-anchor="middle">交付孪生</text><text x="360" y="1003" font-size="11" fill="#63717a" font-weight="400" text-anchor="middle">证据与重放</text><path d="M138 987H158" fill="none" stroke="#63717a" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-63717a)"/><path d="M278 987H298" fill="none" stroke="#63717a" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-63717a)"/><text x="220" y="1060" font-size="13" fill="#172b39" font-weight="600" text-anchor="middle">最终测试不回流到本轮模型选择</text><text x="220" y="1090" font-size="11" fill="#63717a" font-weight="400" text-anchor="middle">虚线表示需要新的真实测量。拟议系统。</text></g></svg>
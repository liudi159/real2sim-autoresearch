round" marker-end="url(#arrow-227c79)"/><text x="640" y="503" font-size="13" fill="#227c79" font-weight="400" text-anchor="middle">决策 + 版本 + 失败原因 → 研究记忆 → 下一轮诊断</text><path d="M431 370V438H314" fill="none" stroke="#c25b37" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-c25b37)"/><rect x="56" y="402" width="254" height="74" rx="8" fill="#fff6ee" stroke="#e7c3ac"/><text x="72" y="427" font-size="13" fill="#c25b37" font-weight="600" text-anchor="start">证据不足 → 真实补测请求</text><text x="72" y="453" font-size="12" fill="#63717a" font-weight="400" text-anchor="start">采集完成 → 新数据版本 → 重评</text><path d="M56 438H15V106H28" fill="none" stroke="#c25b37" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-c25b37)"/><path d="M947 555V609H190V624" fill="none" stroke="#172b39" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow-172b39)"/><text x="932" y="593" font-size="12" fill="#63717a" font-weight="400" text-anchor="end">满足停止条件</text><text x="32" y="593" font-size="14" fill="#63717a" font-weight="600" text-anchor="start">03 / 冻结以后，才进入独立检验</text><rect x="32" y="628" width="316" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="50" y="652" font-size="11" fill="#172b39" font-weight="600" text-anchor="start">FREEZE</text><text x="50" y="680" font-size="19" fill="#172b39" font-weight="600" text-anchor="start">冻结选定候选</text><text x="50" y="706" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">模型 · 参数 · 数据与代码版本</text><rect x="386" y="628" width="316" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="404" y="652" font-size="11" fill="#172b39" font-weight="600" text-anchor="start">HELD-OUT</text><text x="404" y="680" font-size="19" fill="#172b39" font-weight="600" text-anchor="start">独立测试</text><text x="404" y="706" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">新动作 · 新条件 · 已知失败</text><rect x="740" y="628" width="316" height="98" rx="8" fill="whi
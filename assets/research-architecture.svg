<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">Real2Sim AutoResearch 完整框架</title><desc id="desc">观测与场景建立后冻结协议。研究外循环诊断、设计、辨识、开发比较；内循环更新参数，补测创建新数据版本。候选冻结后独立测试，再交付可复现模型。</desc><defs><marker id="arrow-172b39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#172b39" stroke-width="1.5"/></marker><marker id="arrow-63717a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#63717a" stroke-width="1.5"/></marker><marker id="arrow-227c79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#227c79" stroke-width="1.5"/></marker><marker id="arrow-c25b37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#c25b37" stroke-width="1.5"/></marker></defs><g font-family="Inter, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1120" height="800" rx="0" fill="#fbfaf6" stroke="none"/><text x="32" y="36" font-size="14" fill="#63717a" font-weight="600" text-anchor="start">01 / 从观测建立实验对象</text><rect x="32" y="56" width="316" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="50" y="80" font-size="11" fill="#172b39" font-weight="600" text-anchor="start">INPUT</text><text x="50" y="108" font-size="19" fill="#172b39" font-weight="600" text-anchor="start">真实 / 合成观测</text><text x="50" y="134" font-size="13" fill="#63717a" font-weight="400" text-anchor="start">视频 · 动作 · 尺度 · 测量</text><rect x="386" y="56" width="316" height="98" rx="8" fill="white" stroke="#d8dedf"/><text x="404" y="80" font-size="11" fill="#172b39" font-weight="600" text-anchor="start">SCENE</text><text x="404" y="108" font-size="19" fill="#172b39" font-weight="600" text-anchor="start">可执行物理场景<